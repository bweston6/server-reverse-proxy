worker_processes 24;

events {
	use epoll;
}

http {
	# mime types
	include	mime.types;
	default_type  application/octet-stream;

	# tcp
	sendfile on;
	tcp_nopush on;

	# gzip
	gzip on;
	gzip_comp_level 6;
	gzip_proxied any;
	gzip_types text/plain text/css application/javascript application/xml;

	# wildcard cert
	ssl_certificate /etc/letsencrypt/live/bweston.uk/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/bweston.uk/privkey.pem;

	# generated 2025-05-15, Mozilla Guideline v5.7, nginx 1.27.5, OpenSSL 3.0.15, modern config
	# https://ssl-config.mozilla.org/#server=nginx&version=1.27.5&config=modern&openssl=3.0.15&guideline=5.7

	# modern configuration
	ssl_protocols TLSv1.3;
	ssl_ecdh_curve X25519:prime256v1:secp384r1;
	ssl_prefer_server_ciphers off;

	# OCSP stapling
	ssl_stapling on;
	ssl_stapling_verify on;

	# verify chain of trust of OCSP response using Root CA and Intermediate certs
	ssl_trusted_certificate /etc/letsencrypt/live/bweston.uk/chain.pem;

	# replace with the IP address of your resolver;
	# async 'resolver' is important for proper operation of OCSP stapling
	resolver 127.0.0.11 valid=1m;

	# HSTS (ngx_http_headers_module is required) (63072000 seconds)
	add_header Strict-Transport-Security "max-age=63072000" always;

	# enable protocols
	http2 on;
	## poor download performance even with increased buffers
	# http3 on;
	# quic_retry on;
	# quic_gso on;
	# http3_stream_buffer_size 4M;
	# add_header Alt-Svc 'h3=":443";ma=86400,h3-29=":443";ma=86400,h3-27=":443";ma=86400' always;
	# add_header x-quic 'h3' always;

	# HSTS
	server {
		listen 80 default_server;

		return 301 https://$host$request_uri;
	}

	include sites-enabled/*;
}
